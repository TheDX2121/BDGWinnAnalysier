<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Analyzer Dashboard</title>

  <link
    rel="stylesheet"
    href="dashboard.css"
  >

</head>

<body>

  <header>

    <div>
      <strong>ANALYZER</strong>
    </div>

    <button id="logoutBtn">
      Logout
    </button>

  </header>

  <main>

    <section class="top">

      <div>
        <h1>Dashboard</h1>
        <p>Big / Small Pattern Analysis</p>
      </div>

      <select id="datasetSelect">
        <option value="">
          Select Dataset
        </option>
      </select>

    </section>

    <section class="input-box">

      <h2>Add Outcomes</h2>

      <p>
        Example: 9,8,1,9
      </p>

      <textarea
        id="outcomeInput"
        placeholder="Enter numbers separated by commas"
      ></textarea>

      <button id="addBtn">
        Add Outcomes
      </button>

    </section>

    <section>

      <h2>Pattern Statistics</h2>

      <div id="stats">
        Select a dataset.
      </div>

    </section>

  </main>

  <script src="dashboard.js"></script>

</body>

</html>
