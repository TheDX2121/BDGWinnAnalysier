<form id="loginForm">

  <label for="username">
    Username
  </label>

  <input
    id="username"
    type="text"
    autocomplete="username"
    placeholder="Enter your username"
    required
  />

  <label for="password">
    Password
  </label>

  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="Enter your password"
    required
  />

  <button type="submit" id="loginButton">
    <span>ACCESS ANALYZER</span>
  </button>

</form>
