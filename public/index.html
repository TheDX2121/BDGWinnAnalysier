<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Analyzer Login</title>

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <main class="login-page">

    <div class="login-card">

      <div class="logo">
        ANALYZER
      </div>

      <h1>Welcome Back</h1>

      <p class="subtitle">
        Sign in to continue
      </p>

      <form id="loginForm">

        <input
          id="email"
          type="email"
          placeholder="Email"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          LOGIN
        </button>

      </form>

      <p id="message"></p>

    </div>

  </main>

  <script src="login.js"></script>

</body>
</html>
